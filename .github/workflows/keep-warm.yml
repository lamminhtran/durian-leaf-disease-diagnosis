# Giữ cho dịch vụ trên Render không ngủ.
#
# Gói free ngủ sau 15 phút không có lưu lượng, đánh thức mất khoảng một phút
# cộng thêm ~108 giây nạp mô hình ở 0.1 CPU — người truy cập đầu tiên có thể
# phải chờ 2-3 phút. Ping định kỳ giúp tránh hẳn chuyện đó.
#
# Quota: gói free cho 750 giờ/tháng, một tháng ~730 giờ, nên chạy 24/7 vừa đủ.
# Nếu workspace của bạn có dịch vụ free khác thì quota bị chia sẻ — khi đó hãy
# tắt workflow này đi.
name: Giữ ấm dịch vụ Render

on:
  schedule:
    # Mỗi 10 phút. GitHub Actions có thể chạy trễ vài phút ở giờ cao điểm,
    # nhưng vẫn thưa hơn ngưỡng ngủ 15 phút.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Chưa đặt secret RENDER_URL — bỏ qua."
            exit 0
          fi
          # --max-time 120: lần đầu sau khi ngủ dậy có thể lâu.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$URL/healthz" || echo 000)
          echo "HTTP $code"
          [ "$code" = "200" ]

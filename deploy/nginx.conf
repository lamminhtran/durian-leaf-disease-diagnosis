# Reverse proxy cho dịch vụ chẩn đoán bệnh lá sầu riêng.
#
# Việc của nginx ở đây:
#   1. Kết thúc TLS và chuyển hướng HTTP sang HTTPS.
#   2. Chặn request quá lớn TRƯỚC khi chúng tới tầng Python.
#   3. Giới hạn tần suất ở mức toàn cụm — tin cậy hơn bộ đếm trong RAM của ứng
#      dụng, vốn chỉ đếm riêng cho từng worker.
#   4. Đặt timeout đủ dài cho suy luận trên CPU (chậm hơn GPU nhiều lần).

# Vùng giới hạn tần suất, khoá theo IP client. 10m đủ cho khoảng 160k IP.
limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream durian_api {
    server api:8000;
    keepalive 16;
}

# --- HTTP: chỉ để chuyển hướng sang HTTPS ---
server {
    listen 80;
    server_name _;

    # Chừa đường cho ACME/Let's Encrypt gia hạn chứng chỉ.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Chặn ảnh quá lớn ngay tại đây; ứng dụng cũng tự chặn ở mức 10MB, nhưng
    # chặn sớm thì không tốn worker Python để đọc rồi vứt đi.
    client_max_body_size 12m;
    client_body_timeout  60s;

    limit_conn conn_limit 10;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # --- Endpoint suy luận: hạn mức chặt hơn và timeout dài hơn ---
    location /api/predict {
        limit_req zone=predict_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://durian_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Suy luận trên CPU có thể mất vài giây với máy yếu.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        # Không đệm: trả phản hồi về client ngay khi có.
        proxy_buffering off;
    }

    # --- Tài nguyên tĩnh ---
    # KHÔNG đặt expires/Cache-Control ở đây. Ứng dụng đã tự quyết định: URL có dấu
    # vân tay nội dung (?v=<hash>) thì cache vĩnh viễn, URL không có thì 'no-cache'
    # và kiểm lại bằng ETag. Nếu nginx đè 'expires 1h' lên, sau khi deploy người
    # dùng sẽ dính JS/CSS cũ suốt một tiếng dù HTML đã mới.
    location /static/ {
        proxy_pass http://durian_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # --- Health check: không giới hạn tần suất, không ghi log cho đỡ nhiễu ---
    location ~ ^/(healthz|readyz)$ {
        access_log off;
        proxy_pass http://durian_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://durian_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}

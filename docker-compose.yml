# Chạy local: chỉ dịch vụ API + web, không có reverse proxy.
# Bản dùng cho máy chủ công khai nằm ở deploy/docker-compose.prod.yml.
services:
  api:
    build: .
    image: durian-leaf-diagnosis:latest
    container_name: durian-api
    restart: unless-stopped
    ports:
      # Đổi cổng mà không cần sửa tệp:  HOST_PORT=8081 docker compose up
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      # Bản chạy công khai dùng mô hình CHƯNG CẤT, không phải giáo viên.
      # Đo trong container 512MB: học trò 367MB sau khi nạp / 418MB dưới 8 request
      # đồng thời; giáo viên 490MB / 504MB — chạy được nhưng sát trần, một đợt
      # truy cập bất thường là container bị huỷ vì hết bộ nhớ.
      # Đánh đổi: 96.74% thay vì 98.54%, bù lại nhanh gấp 4,5 lần.
      BACKBONE_NAME: mobilenetv3_small_100
      MODEL_PATH: models/mobilenetv3_small_kd_best.pth
      METRICS_PREFIX: mobilenetv3_small_kd
      ENVIRONMENT: development
      LOG_FORMAT: console
      LOG_LEVEL: INFO
      DEVICE: cpu
      CORS_ALLOW_ORIGINS: "*"
      RATE_LIMIT_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
